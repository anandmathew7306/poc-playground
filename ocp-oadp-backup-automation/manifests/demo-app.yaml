# Small test app with a disk, used to prove backups. Writes a timestamp to its disk.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: demo-app
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: demo-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: writer}
  template:
    metadata:
      labels: {app: writer}
    spec:
      containers:
        - name: writer
          image: registry.access.redhat.com/ubi9/ubi-minimal
          command: [sh, -c, 'date >> /data/stamps.txt; sleep infinity']
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
