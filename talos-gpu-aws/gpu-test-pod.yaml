# One-shot proof that Kubernetes can schedule a real GPU workload.
# Expect STATUS Completed and a full nvidia-smi table in the logs.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: gpu-test
      image: nvidia/cuda:12.6.0-base-ubuntu24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
